[alias]
cw = "check --workspace"
cg = "run --bin doodle -- format --output rust --dest generated/gencode.rs"
coverage = "tarpaulin --workspace --exclude smallsorts analytic-parser --out lcov --engine llvm"
testall = "test --workspace --exclude smallsorts --exclude analytic-parser"

[profile.profiling]
inherits = "release"
debug = true

[env]
RUST_MIN_STACK = "8388608"

# Locations of the test-files (inputs of tests, benches, and the default inputs of some binaries).
# Each kind of test-file lives at `$TEST_OBJ_ROOT/$TEST_OBJ_SUFFIX_<KIND>/`; consumers read these
# at compile-time with `env!`, so binaries keep working when run outside of cargo.
TEST_OBJ_ROOT = { value = ".", relative = true }
TEST_OBJ_SUFFIX_GIF = "."
TEST_OBJ_SUFFIX_HEIC = "."
TEST_OBJ_SUFFIX_JPEG = "."
TEST_OBJ_SUFFIX_PNG = "."
TEST_OBJ_SUFFIX_WEBP = "."
TEST_OBJ_SUFFIX_IMAGE_CORPUS = "test-images"
TEST_OBJ_SUFFIX_MP4 = "."
TEST_OBJ_SUFFIX_TAR = "."
TEST_OBJ_SUFFIX_TGZ = "."
TEST_OBJ_SUFFIX_GZIP = "."
TEST_OBJ_SUFFIX_TEXT = "."
TEST_OBJ_SUFFIX_UTF8 = "."
TEST_OBJ_SUFFIX_BSON = "test_bson"
TEST_OBJ_SUFFIX_ELF = "."
TEST_OBJ_SUFFIX_WALDO = "."
TEST_OBJ_SUFFIX_RLE = "."
TEST_OBJ_SUFFIX_NUMBERS = "."
TEST_OBJ_SUFFIX_PEANO = "."
TEST_OBJ_SUFFIX_FONT = "test-fonts"
TEST_OBJ_SUFFIX_FONT_BROKEN = "broken-fonts"
TEST_OBJ_SUFFIX_FONT_MALFORMED = "malformed-fonts"
