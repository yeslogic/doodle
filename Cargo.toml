[workspace]
members = [
    ".",
    "generated/",
    "doodle-formats/",
    "smallsorts",
    "experiments/analytic-parser",
    "doodle-numexpr-macro",
]

[package]
name = "doodle"
version = "0.1.0"
edition = "2024"

[[test]]
name = "runtime_repeat"
path = "tests/runtime_repeat/mod.rs"
test = true

[[test]]
name = "permit_state_error"
path = "tests/permit_state_error/mod.rs"
test = true

[features]
default = []
alt = []
format_enforce = []
__unify_mixed_to_int = []
tc_seq_length_polymorphic = []

[[bin]]
name = "doodle"
path = "doodle-formats/src/main.rs"
bench = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dev-dependencies]
proptest = "1.1.0"
expect-test = "1.4"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
num-traits = "0.2"
rustc-hash = "2.1.1"
cons-rs = "0.7.3"
intmap = "3.1.3"
smallvec = "1.15.1"
vec-collections = "0.4.3"
log = "0.4"
stderrlog = "0.6.0"
num-bigint = "0.5"
cfg-if = "1.0"
range-set = "0.1.1"
smallsorts = { path = "smallsorts/", version = "0.1.0" }
doodle-numexpr-macro = { path = "doodle-numexpr-macro", version = "0.1.0" }
